  title: "OSS Cameroon // Building Cameroon one open source at a time."
  params:
    description: "Our country is developing, and has a strong need for skills in the tech industry. We want to encourage young people to
choose this field so we can grow our tech ecosystem and popularise the tech culture across the country. Through this
initiative, We want to promote the talent and know-how of Cameroonians by using our technicals skill to bring solutions to
problems found in our society using open source software."
