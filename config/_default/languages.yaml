    title: "OSS Cameroon // Construire le Cameroun, un projet open source à la fois."
    description: "Notre pays est en développement et a un fort besoin de compétences dans l’industrie technologique. Nous voulons encourager les jeunes à choisir ce domaine afin de développer notre écosystème technologique et de populariser la culture du numérique à travers tout le pays. À travers cette initiative, nous souhaitons promouvoir le talent et le savoir-faire des Camerounais en utilisant nos compétences techniques pour apporter des solutions aux problèmes rencontrés dans notre société grâce aux logiciels open source."
